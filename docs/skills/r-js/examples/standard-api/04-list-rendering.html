<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>List rendering — r-js example</title>
  <!-- Adjust this path if your r-js distribution is elsewhere. -->
  <script src="../../../../../dist/r.min.js"></script>
</head>

<body>
  <div id="app" hidden>
    <ul>
      <li data-f="{{items => item, index}}">
        {{index + 1}}. {{item}}
      </li>
    </ul>
    <button data-if="{{!items.includes('JS')}}"
            data-on:click="{{items.push('JS')}}">Add JavaScript</button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const app = document.getElementById('app');
      const state = R(app, { items: ['HTML', 'CSS'] });
      state.items.push('SVG');
    });
  </script>

</body>

</html>
