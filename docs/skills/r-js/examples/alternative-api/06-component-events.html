<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Component events — r-js example</title>
  <!-- Adjust this path if your r-js distribution is elsewhere. -->
  <script src="../../../../../dist/r.alt.min.js"></script>
</head>

<body>

  <template id="save-button">
    <button on:click="{{$r.emit('save', label)}}">
      Save {{label}}
    </button>
  </template>

  <template id="save-button-wrapped" wrap="button"
            on:click="{{$r.emit('save', label+'_wrapped')}}">
    Save {{label}}_wrapped
  </template>

  <div id="app" hidden>

    <p>Last saved: {{saved}}</p>

    <r-save-button on:save="{{saved = $evt.detail}}"
                   pr:label="{{buttonLabel}}"></r-save-button>
    <r-save-button-wrapped on:save="{{saved = $evt.detail}}"
                           pr:label="{{buttonLabel}}"></r-save-button-wrapped>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const app = document.getElementById('app');
      R(app, { buttonLabel: 'draft', saved: 'nothing' });
    });
  </script>

</body>

</html>
