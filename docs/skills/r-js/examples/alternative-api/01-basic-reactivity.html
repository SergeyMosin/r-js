<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Basic reactivity — r-js example</title>
  <!-- Adjust this path if your r-js distribution is elsewhere. -->
  <script src="../../../../../dist/r.alt.min.js"></script>
</head>

<body>
  <div id="app" hidden>
    <p>Message: {{message}}</p>
    <p>Count: {{count}}</p>
    <button on:click="{{count++}}">Increment</button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const app = document.getElementById('app');

      const state = R(app, { message: 'Hello r-js', count: 0 });

      state.count++;
    });
  </script>

</body>

</html>
